services:
  # IL PROXY (l'unico ad avere porte aperte verso il tuo computer)
  reverse_proxy:
    image: nginx:alpine
    container_name: my_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_uno
      - backend_due
    restart: always

  # PRIMO BACKEND (completamente isolato all'interno)
  backend_uno:
    image: nginxdemos/hello:plain-text
    container_name: backend_uno
    restart: always

  # SECONDO BACKEND (anch'esso isolato)
  backend_due:
    image: nginxdemos/hello:plain-text
    container_name: backend_due
    restart: always