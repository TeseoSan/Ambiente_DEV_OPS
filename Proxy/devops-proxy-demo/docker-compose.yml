services:
  # 1. IL REVERSE PROXY
  reverse_proxy:
    image: nginx:alpine
    container_name: my_proxy
    ports:
      # Espone la porta 80 del tuo computer mappandola sulla 80 del container
      - "80:80"
    volumes:
      # Montiamo la nostra configurazione dentro al container
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_app
    restart: always

  # 2. IL BACKEND (applicazione dimostrativa)
  backend_app:
    image: nginxdemos/hello:plain-text
    container_name: my_backend
    # NOTA DEVOPS: Non esponiamo 'ports' qui!
    # L'app non deve essere raggiungibile dall'esterno, solo dal proxy tramite la rete interna.
    restart: always