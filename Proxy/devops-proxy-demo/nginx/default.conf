server {
    listen 80;
    server_name localhost;

    # Se l'URL inizia con /servizio1/ manda a backend_uno
    location /servizio1/ {
        # Nota lo slash finale: serve per riscrivere la richiesta alla radice del backend
        proxy_pass http://backend_uno:80/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Se l'URL inizia con /servizio2/ manda a backend_due
    location /servizio2/ {
        proxy_pass http://backend_due:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Risposta di cortesia se qualcuno chiama la radice "/"
    location / {
        return 200 "Sei sul Proxy Nginx! Prova a visitare /servizio1/ oppure /servizio2/\n";
        add_header Content-Type text/plain;
    }
}