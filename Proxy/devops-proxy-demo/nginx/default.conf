server {
    listen 80;
    server_name localhost;

    location / {
        # 'backend_app' è il nome del servizio che definiremo nel docker-compose!
        # Docker farà da DNS interno risolvendo 'backend_app' nell'IP corretto.
        proxy_pass http://backend_app:80;

        # Header raccomandati per passare le informazioni corrette al backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}